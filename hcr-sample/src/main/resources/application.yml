spring:
  application:
    name: hcr-sample
  datasource:
    url: jdbc:h2:mem:hcr_sample;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true   # chạy data.sql sau khi Hibernate tạo schema
  sql:
    init:
      mode: always
  data:
    redis:
      host: localhost
      port: 6379
      # Lettuce kết nối lazy — khi strategy=pessimistic-lock không ai dùng RedisTemplate
      # → app start OK dù Redis chưa chạy. Khi switch sang redis-atomic, Redis phải được khởi động trước.
      lettuce:
        shutdown-timeout: 100ms

hcr:
  inventory:
    strategy: redis-atomic #pessimistic-lock        # P1 for sample (no Redis needed)
    circuit-breaker:
      enabled: false

  saga:
    mode: sync
    reservation-timeout-minutes: 5

  payment:
    mock-enabled: true                # sample app dùng MockPaymentGateway — production phải false
    timeout-ms: 30000
    max-retries: 3
    polling-interval-ms: 5000
    max-polling-attempts: 6

  event-bus:
    type: in-memory                   # in-memory for sample app

  gateway:
    rate-limiter:
      enabled: false
    idempotency-ttl-seconds: 86400

  reconciliation:
    schedule-delay-ms: 300000

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, hcr
  metrics:
    tags:
      application: hcr-sample
