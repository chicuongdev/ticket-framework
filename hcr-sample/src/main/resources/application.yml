spring:
  application:
    name: hcr-sample
  datasource:
    url: jdbc:postgresql://localhost:5432/hcr_sample
    username: hcr
    password: hcr
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop        # dev: DROP + CREATE mỗi lần start
    defer-datasource-initialization: true   # chạy data.sql sau khi Hibernate tạo schema
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  sql:
    init:
      mode: always
  data:
    redis:
      host: localhost
      port: 6379
      lettuce:
        shutdown-timeout: 100ms
  kafka:
    bootstrap-servers: localhost:9092

hcr:
  inventory:
    strategy: redis-atomic            # P3 — full stack: Redis + Kafka + Postgres
    circuit-breaker:
      enabled: false

  saga:
    mode: sync
    reservation-timeout-minutes: 5

  payment:
    mock-enabled: true                # sample app dùng MockPaymentGateway — production phải false
    timeout-ms: 30000
    max-retries: 3
    polling-interval-ms: 5000
    max-polling-attempts: 6

  event-bus:
    type: kafka                       # KafkaEventBusAutoConfiguration kích hoạt
    kafka:
      bootstrap-servers: localhost:9092
      topic-prefix: "hcr."

  gateway:
    rate-limiter:
      enabled: false
    idempotency-ttl-seconds: 86400

  reconciliation:
    schedule-delay-ms: 300000

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, hcr
  metrics:
    tags:
      application: hcr-sample
