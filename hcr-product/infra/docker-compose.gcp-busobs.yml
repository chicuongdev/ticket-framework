# ============================================================================
# GCP topology — Bus + Observability VM (hcr-busobs)
# ----------------------------------------------------------------------------
# Chạy Kafka (event bus) + Prom/Grafana/Zipkin (observability).
# TÁCH KHỎI hcr-data vì:
#   - Prometheus scrape app → KHÔNG để cùng box với DB/Redis (nhiễu critical path)
#   - Kafka mem-hungry, để cùng observability để cô lập với data layer
#
# Khởi động trên hcr-busobs:
#   KAFKA_HOST=<HCR_BUSOBS_IP> docker compose -f docker-compose.gcp-busobs.yml up -d
#   (KAFKA_HOST = private IP của VM hcr-busobs — BẮT BUỘC set, nếu không Kafka
#    sẽ advertise '10.20.0.4' default và sai khi VM có IP khác.)
#
# TODO_GCP_IP: thay <HCR_BUSOBS_IP> trên đây + verify file
# `observability/prometheus.gcp.yml` đã điền <HCR_APP_IP>.
# ============================================================================
name: hcr-busobs

services:
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: hcr-kafka
    ports:
      - "0.0.0.0:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      # WARN: KAFKA_HOST PHẢI là private IP của hcr-busobs VM (vd 10.20.0.4).
      # Nếu để 'localhost', app từ hcr-app connect bootstrap thành công
      # nhưng fail khi Kafka redirect về 'localhost:9092' (resolve sang app VM).
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://${KAFKA_HOST:-10.20.0.4}:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVGRkNBRjEwNDAxNA
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 10

  zipkin:
    image: openzipkin/zipkin:latest
    container_name: hcr-zipkin
    ports:
      - "0.0.0.0:9411:9411"

  prometheus:
    image: prom/prometheus:latest
    container_name: hcr-prometheus
    ports:
      - "0.0.0.0:9090:9090"
    volumes:
      # Mount prometheus.gcp.yml (targets = hcr-app private IP, scrape 30s).
      # KHÁC với prometheus.yml (local dev — targets host.docker.internal).
      # TODO_GCP_IP: prometheus.gcp.yml còn <HCR_APP_IP> placeholder cần điền.
      - ./observability/prometheus.gcp.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:latest
    container_name: hcr-grafana
    ports:
      - "0.0.0.0:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
