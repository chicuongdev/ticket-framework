# ============================================================================
# ms-inventory — BASE CONFIG (shared across P1 / P2 / P3 prototypes)
# ============================================================================
# Prototype được chọn qua env var ACTIVE_PROTOTYPE (default = p1):
#   p1 → SELECT FOR UPDATE  (Pessimistic lock,  sync saga)
#   p2 → @Version + retry   (Optimistic lock,   sync saga)
#   p3 → Redis Lua DECRBY   (Redis Atomic,      async saga + DB sync consumer)
#
# Override config tương ứng nằm trong application-p{1|2|3}.yml.
# Tham khảo HcrProperties.java cho danh sách key hợp lệ.
# ============================================================================
server:
  port: 8082

spring:
  application:
    name: ms-inventory
  profiles:
    active: ${ACTIVE_PROTOTYPE:p1}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:inventory_p3_db}
    username: ${DB_USER:hcr}
    password: ${DB_PASS:hcr}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  sql:
    init:
      mode: always
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}

hcr:
  # NOTE:
  #   hcr.inventory.strategy        → set ở application-p{N}.yml
  #   hcr.inventory.persistence.*   → chỉ p3 cần (single/batch DB sync)
  #   hcr.saga.mode                 → set ở application-p{N}.yml
  inventory:
    circuit-breaker:
      enabled: false
  payment:
    mock-enabled: true
  event-bus:
    type: kafka
    kafka:
      bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
      topic-prefix: "hcr."
      consumer-group: ms-inventory
  gateway:
    rate-limiter:
      enabled: false
  reconciliation:
    schedule-delay-ms: 60000   # 60s — đủ nhanh để verify orphan reconciliation (Case 6) trong test

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, hcr
  metrics:
    tags:
      application: ms-inventory
  tracing:
    sampling:
      probability: 0.01
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
